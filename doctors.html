<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
    <h1>👨‍⚕️ Doctor Management</h1>
    <p>Add and view doctor information</p>
</div>

<div class="container">

<h2>Add Doctor</h2>

<form method="POST">

    <label>Doctor ID:</label>
    <input type="text" name="doctor_id" required>

    <label>Name:</label>
    <input type="text" name="name" required>

    <label>Specialization:</label>
    <input type="text" name="specialization">

    <label>Phone:</label>
    <input type="text" name="phone">

    <label>Email:</label>
    <input type="email" name="email">

    <button type="submit">Add Doctor</button>

</form>

<h2>Doctor Records</h2>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Specialization</th>
    <th>Phone</th>
    <th>Email</th>
</tr>

{% for doctor in doctors %}
<tr>
    <td>{{ doctor[0] }}</td>
    <td>{{ doctor[1] }}</td>
    <td>{{ doctor[2] }}</td>
    <td>{{ doctor[3] }}</td>
    <td>{{ doctor[4] }}</td>
</tr>
{% endfor %}

</table>

<br>
<a href="/"><button>Back to Dashboard</button></a>

</div>

</body>
</html>
